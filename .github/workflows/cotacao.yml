name: Atualizar cotação

on:
  schedule:
    # de 10 em 10 minutos, de segunda a sexta, das 07:00 às 16:50 UTC (cobre o horário da bolsa de Paris)
    - cron: '*/10 7-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cotacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obter a cotação
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, os
          from zoneinfo import ZoneInfo

          UA = {'User-Agent': 'Mozilla/5.0 (compatible; cotacao-bot/1.0)'}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode('utf-8', 'replace')

          def yahoo():
              d = json.loads(get('https://query1.finance.yahoo.com/v8/finance/chart/DG.PA?interval=1m&range=1d'))
              res = d['chart']['result'][0]
              m = res['meta']
              q = (res.get('indicators', {}).get('quote') or [{}])[0]
              abertura = next((x for x in (q.get('open') or []) if x), None)
              return dict(px=m['regularMarketPrice'], at=int(m['regularMarketTime']) * 1000,
                          prev=m.get('chartPreviousClose') or m.get('previousClose'),
                          open=abertura, high=m.get('regularMarketDayHigh'), low=m.get('regularMarketDayLow'),
                          src='Yahoo Finance (automático, pode ter atraso)')

          def stooq():
              linhas = get('https://stooq.com/q/l/?s=dg.fr&f=sd2t2ohlcv&h&e=csv').strip().splitlines()
              c = dict(zip(linhas[0].lower().split(','), linhas[1].split(',')))
              dt = datetime.datetime.strptime(c['date'] + ' ' + c['time'], '%Y-%m-%d %H:%M:%S').replace(tzinfo=ZoneInfo('Europe/Paris'))
              return dict(px=float(c['close']), at=int(dt.timestamp() * 1000), prev=None,
                          open=float(c['open']), high=float(c['high']), low=float(c['low']),
                          src='Stooq (automático, pode ter atraso)')

          novo = None
          for fonte in (yahoo, stooq):
              try:
                  r = fonte()
                  px = float(r['px'])
                  agora = datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000
                  if not (20 < px < 1000) or r['at'] > agora + 3600000:
                      raise ValueError('valor fora do esperado')
                  novo = r
                  print('Fonte usada:', r['src'], px)
                  break
              except Exception as e:
                  print('Falhou', fonte.__name__, '->', e)

          if not novo:
              print('Sem cotação nova: o ficheiro fica como está.')
              raise SystemExit(0)

          try:
              atual = json.load(open('cotacao.json', encoding='utf-8'))
          except Exception:
              atual = {}

          if novo['at'] < atual.get('at', 0):
              print('A cotação obtida é mais antiga do que a guardada: ignorada.')
              raise SystemExit(0)

          prev = novo.get('prev') or atual.get('prev')
          out = {'px': round(novo['px'], 4), 'px2': round(novo['px'], 4), 'at': novo['at'], 'src': novo['src']}
          for k in ('open', 'high', 'low'):
              if novo.get(k):
                  out[k] = round(float(novo[k]), 4)
          if prev:
              out['prev'] = round(float(prev), 4)
              out['chg'] = round(novo['px'] - float(prev), 2)
              out['pct'] = round((novo['px'] - float(prev)) / float(prev) * 100, 2)
          for k in ('w52lo', 'w52hi'):
              if atual.get(k):
                  out[k] = atual[k]

          if json.dumps(out, sort_keys=True) != json.dumps({k: atual.get(k) for k in out}, sort_keys=True) or novo['at'] != atual.get('at'):
              json.dump(out, open('cotacao.json', 'w', encoding='utf-8'), ensure_ascii=False)
              print('cotacao.json atualizado:', out)
          else:
              print('Sem alterações.')
          PY

      - name: Guardar se mudou
        run: |
          if [ -n "$(git status --porcelain cotacao.json)" ]; then
            git config user.name "cotacao-bot"
            git config user.email "cotacao-bot@users.noreply.github.com"
            git add cotacao.json
            git commit -m "Atualiza cotação"
            git push
          else
            echo "Nada a guardar."
          fi
